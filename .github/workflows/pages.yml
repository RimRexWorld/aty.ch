name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The three the deploy needs and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Cancelling a superseded run is safe here because the
# build is pure — a half-finished run leaves nothing behind.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same toolchain as `nix develop` on a workstation. The alternative —
      # apt-get install imagemagick webp libavif-bin — would silently drift to
      # whatever encoder versions Ubuntu ships that month, and the encoder
      # version is baked into every byte visitors download.
      - uses: DeterminateSystems/nix-installer-action@main

      # The image derivatives dominate the build. Keyed on the photos
      # themselves, so a copy edit in content/ reuses every encode and only a
      # changed or added photo costs anything.
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            dist/img
          key: img-${{ hashFiles('photos/**', 'tools/build.mjs') }}

      # --strict: fails the build if any field in content/ is still null.
      # A published listing with "missing" where the price should be is worse
      # than no listing at all.
      - run: nix develop --command ./build.sh --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
