name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The three the deploy needs and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Cancelling a superseded run is safe here because the
# build is pure — a half-finished run leaves nothing behind.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same toolchain as `nix develop` on a workstation. The alternative —
      # apt-get install imagemagick webp libavif-bin — would silently drift to
      # whatever encoder versions Ubuntu ships that month, and the encoder
      # version is baked into every byte visitors download.
      - uses: DeterminateSystems/nix-installer-action@main

      # The image derivatives dominate the build. Keyed on the photos
      # themselves, so a copy edit in content/ reuses every encode and only a
      # changed or added photo costs anything.
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            dist/img
          key: img-${{ hashFiles('photos/**', 'tools/build.mjs') }}

      # Deliberately NOT --strict. An incomplete listing still deploys, because
      # DNS, the certificate, Pages routing and the real load time from
      # Australia cannot be tested against a page that does not exist.
      #
      # What stops a half-filled page from passing as finished is in the page
      # itself, not here: while any field in content/ is null the build emits a
      # "Preview — not finished yet" banner and a noindex meta, and both
      # disappear on their own once the last field is filled. See the comment
      # at the top of render() in tools/build.mjs.
      #
      # Run `./build.sh --strict` before printing the flyer — that is the gate
      # that matters, because the QR code is the thing that cannot be recalled.
      - run: nix develop --command ./build.sh

      # enablement: turns Pages on via the API and sets the source to Actions,
      # instead of failing with "Get Pages site failed" until someone finds the
      # right checkbox in Settings. The `pages: write` permission above is what
      # makes this allowed — the repo configures itself, so a fresh clone or a
      # second repo needs no manual step.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
